<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <title>Login | Dwaarseva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Dwaarseva home"><img class="brand-logo" src="logo.svg" alt="" width="40" height="40" /><span class="brand-text">Dwaarseva<small class="brand-tag">Seva at your doorstep with reliable people. Trusted Service. Peace of Mind.</small></span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="menu" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav id="menu" class="menu" aria-label="Main">
        <a href="index.html#services">Services</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="providers.html">Providers</a>
        <a href="login.html" id="auth-link" class="btn btn-small btn-ghost">Login</a>
        <a href="booking.html" class="btn btn-small">Book now</a>
      </nav>
    </div>
  </header>

  <main id="main" class="section auth-page">
    <div class="container auth-wrap">
      <div class="auth-card">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-login" aria-selected="true" class="tab active">Login</button>
          <button type="button" role="tab" id="tab-signup" aria-selected="false" class="tab">Sign up</button>
        </div>

        <p id="config-note" class="notice" hidden>
          Login is not switched on yet. Add your Firebase keys in <code>config.js</code> (see SETUP.md).
        </p>

        <form id="auth-form" class="form flat" novalidate>
          <label for="a-name" data-signup hidden>Full name</label>
          <input id="a-name" name="name" type="text" autocomplete="name" data-signup hidden />

          <label for="a-email">Email</label>
          <input id="a-email" name="email" type="email" autocomplete="email" required />

          <label for="a-pw">Password</label>
          <input id="a-pw" name="password" type="password" autocomplete="current-password" minlength="6" required />

          <button type="submit" class="btn" id="a-submit">Login</button>
          <button type="button" class="btn btn-ghost" id="a-google">Continue with Google</button>
          <p><a href="#" id="a-forgot">Forgot password?</a></p>
          <p id="a-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p class="copy">&copy; <span id="year"></span> Dwaarseva. All rights reserved.</p>
  </footer>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script src="common.js"></script>
  <script src="login.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
